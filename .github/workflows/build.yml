---
name: Build Gamescope capture test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gamescope-capture-test
  cancel-in-progress: false

jobs:
  gamescope:
    if: github.repository == 'mrdidit/armada' && github.ref == 'refs/heads/test-gamescope-pipewire-20261016'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Check out the exact test source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check native ARM builder and install RPM inspection tools
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          docker buildx version
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm

      - name: Build only the Gamescope package
        run: |
          set -euo pipefail
          source packages/toolchain.env
          source packages/mesa-x86/BASE.env
          source packages/TERRA.env
          output="$RUNNER_TEMP/gamescope-capture"
          mkdir -p "$output/evidence"
          git rev-parse HEAD > "$output/evidence/source-commit.txt"
          git rev-parse 'HEAD^{tree}' > "$output/evidence/source-tree.txt"
          printf '%s\n' "$BUILDER_IMAGE" > "$output/evidence/builder-image.txt"
          printf '%s\n' "$TERRA_COMMIT" > "$output/evidence/terra-commit.txt"
          cp packages/gamescope/patches/0029-pipewire-rework-buffer-sharing-to-be-thread-safe.patch "$output/evidence/"
          docker buildx build \
            --platform linux/arm64 \
            --file packages/Containerfile \
            --target out-gamescope \
            --build-arg "BUILDER_IMAGE=$BUILDER_IMAGE" \
            --build-arg "GUEST_BUILDER_IMAGE=$GUEST_BUILDER_IMAGE" \
            --output "type=local,dest=$output/packages" \
            --progress plain \
            packages 2>&1 | tee "$output/evidence/build.log"

      - name: Verify package identity and record checksums
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/gamescope-capture"
          python3 - "$output" <<'PY'
          import hashlib
          import json
          import pathlib
          import subprocess
          import sys

          root = pathlib.Path(sys.argv[1])
          packages = sorted((root / "packages/rpms").glob("*.rpm"))
          assert packages, "The build produced no RPMs"
          records = []
          for path in packages:
              header = subprocess.check_output([
                  "rpm", "-qp", "--queryformat", "%{NAME}\t%{VERSION}-%{RELEASE}\t%{ARCH}", str(path)
              ], text=True).split("\t")
              name, version, arch = header
              assert name.startswith("terra-gamescope"), header
              assert arch in ("aarch64", "noarch"), header
              records.append({"file": str(path.relative_to(root)), "name": name,
                              "version": version, "arch": arch,
                              "sha256": hashlib.file_digest(path.open("rb"), "sha256").hexdigest()})
          assert {"terra-gamescope", "terra-gamescope-libs"} <= {r["name"] for r in records}
          (root / "evidence/packages.json").write_text(json.dumps(records, indent=2) + "\n")
          (root / "SHA256SUMS").write_text("".join(f'{r["sha256"]}  {r["file"]}\n' for r in records))
          print(json.dumps(records, indent=2))
          PY

      - name: Upload component and build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gamescope-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gamescope-capture/
          retention-days: 14
          if-no-files-found: warn
