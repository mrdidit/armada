# SPDX-License-Identifier: GPL-2.0-or-later
name: Assemble KPFE scoped charging policy test
on:
  workflow_dispatch:

permissions: {}
concurrency:
  group: kpfe-scoped-policy-test
  cancel-in-progress: false

env:
  BASE_IMAGE: ghcr.io/mrdidit/armada@sha256:3ad2d5de4575d8fffacc92a77aae6a382f9a0066818f5f99e8de3d35cb26313c
  IMAGE: ghcr.io/mrdidit/armada
  TEST_TAG: test-kpfe-scoped-policy-20260928
  INPUT_SHA256: 57282fa6f1d6704d0d1289445dbdbad39a5827741e5c5fea4a74cbcf8ac42a98

jobs:
  inputs:
    if: github.repository == 'mrdidit/armada' && github.ref == 'refs/heads/test-kpfe-scoped-policy-20260928'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write # GitHub restricts draft-release visibility to push access.
    steps:
      - name: Download pinned unpublished build inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/mrdidit/armada/releases/398136818 |
            jq -e '.draft == true and .tag_name == "kpfe-scoped-policy-inputs-20260928"'
          gh api -H 'Accept: application/octet-stream' \
            repos/mrdidit/armada/releases/assets/595107014 > inputs.tar.gz
          printf '%s  inputs.tar.gz\n' "$INPUT_SHA256" | sha256sum -c -
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scoped-policy-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: inputs.tar.gz
          retention-days: 7
          if-no-files-found: error

  assemble:
    needs: inputs
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download this run's verified inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "scoped-policy-inputs-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --dir "$RUNNER_TEMP/input"
          cd "$RUNNER_TEMP/input"
          printf '%s  inputs.tar.gz\n' "$INPUT_SHA256" | sha256sum -c -
          python3 "$GITHUB_WORKSPACE/build_files/prepare-scoped-image-inputs.py" \
            inputs.tar.gz "$GITHUB_WORKSPACE/policy-inputs" "$GITHUB_WORKSPACE/kernel-inputs"
          cd "$GITHUB_WORKSPACE/policy-inputs"
          sha256sum -c SHA256SUMS
      - name: Check local assembly tests
        run: python3 -B -m unittest discover -s tests -p 'test_*image*.py' -v
      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y buildah skopeo jq openssl binutils zstd
      - name: Verify kernel package with build-only ELF tools
        run: |
          set -euo pipefail
          python3 -B build_files/install-scoped-kernel.py --verify-package \
            policy-inputs/kernel/armada-kernel-7.2.3.tar.zst kernel-inputs > kernel-verification.json
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.3
      - name: Verify signed base and prepare image configuration
        id: config
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/evidence"
          cp kernel-verification.json "$RUNNER_TEMP/evidence/kernel-package-verification.json"
          cosign verify --key build_files/kpfe-test-signing.pub "$BASE_IMAGE" > "$RUNNER_TEMP/evidence/base-signature.json"
          skopeo inspect --override-arch arm64 --config "docker://$BASE_IMAGE" > "$RUNNER_TEMP/evidence/base-config.json"
          jq -e '.architecture == "arm64" and .os == "linux" and .config.Cmd == ["/sbin/init"]' "$RUNNER_TEMP/evidence/base-config.json"
          version="20260928.scoped.${GITHUB_SHA:0:7}"
          jq --arg version "$version" --arg revision "$GITHUB_SHA" --arg base "$BASE_IMAGE" '
            .config |
            .Labels["org.opencontainers.image.version"] = $version |
            .Labels["org.opencontainers.image.revision"] = $revision |
            .Labels["org.opencontainers.image.created"] = (now | todateiso8601) |
            .Labels["org.opencontainers.image.description"] = "KPFE scoped charging kernel and persistent policy test" |
            .Labels["org.opencontainers.image.source"] = ("https://github.com/mrdidit/armada/tree/" + $revision) |
            .Labels["org.opencontainers.image.documentation"] = ("https://github.com/mrdidit/armada/blob/" + $revision + "/docs/KPFE-SCOPED-POLICY-TEST.md") |
            .Labels["org.opencontainers.image.base.digest"] = ($base | split("@")[1]) |
            del(.Labels["ostree.commit"], .Labels["ostree.final-diffid"])' \
            "$RUNNER_TEMP/evidence/base-config.json" > "$RUNNER_TEMP/evidence/runtime-config.json"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check signing identity before assembly
        env:
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_SECRET"
          printf '%s\n' "$SIGNING_SECRET" | openssl pkey -pubout -outform DER > "$RUNNER_TEMP/signing-key.der"
          openssl pkey -pubin -in build_files/kpfe-test-signing.pub -outform DER > "$RUNNER_TEMP/trusted-key.der"
          cmp "$RUNNER_TEMP/signing-key.der" "$RUNNER_TEMP/trusted-key.der"
      - name: Assemble without rebuilding kernel or RPMs
        env:
          VERSION: ${{ steps.config.outputs.version }}
        run: |
          set -euo pipefail
          buildah info --storage-opt=overlay.mount_program= |
            jq -e '.store.GraphStatus["Native Overlay Diff"] == "true"'
          buildah bud --storage-opt=overlay.mount_program= \
            --format docker --target chunkah --skip-unused-stages=false \
            --security-opt label=disable --volume "$RUNNER_TEMP:/run/src" \
            --build-arg "BASE_IMAGE=$BASE_IMAGE" --build-arg "ARMADA_VERSION=$VERSION" \
            --build-arg "CHUNKAH_CONFIG_STR=$(jq -c . "$RUNNER_TEMP/evidence/runtime-config.json")" \
            -f Containerfile.scoped-policy-test -t localhost/kpfe-policy-assembly .
      - name: Verify serialized image
        run: |
          set -euo pipefail
          for component in steam proton fex-rootfs; do
            grep -Eq "creating tar layer .*\"xattr/${component}\"" "$RUNNER_TEMP/chunkah.log"
          done
          skopeo inspect --raw "oci:$RUNNER_TEMP/chunked" > "$RUNNER_TEMP/evidence/manifest.json"
          skopeo inspect --config "oci:$RUNNER_TEMP/chunked" > "$RUNNER_TEMP/evidence/config.json"
          jq -e '(.layers | length) > 1 and (.layers | length) <= 128 and
            ((.annotations // {}) | has("ostree.commit") | not) and
            ((.annotations // {}) | has("ostree.final-diffid") | not)' "$RUNNER_TEMP/evidence/manifest.json"
          jq -e --slurpfile expected "$RUNNER_TEMP/evidence/runtime-config.json" '
            .config == $expected[0] and .architecture == "arm64" and .os == "linux" and
            .config.Labels["containers.bootc"] == "1" and .config.Labels["ostree.bootable"] == "true"' "$RUNNER_TEMP/evidence/config.json"
          python3 build_files/verify-steam-bootstrap.py --oci "$RUNNER_TEMP/chunked"
          cp "$RUNNER_TEMP/chunkah.log" "$RUNNER_TEMP/evidence/"
      - name: Publish unique build tag and sign exact digest
        id: publish
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
          VERSION: ${{ steps.config.outputs.version }}
          COSIGN_PASSWORD: ''
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | skopeo login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$REGISTRY_TOKEN" | cosign login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          build_tag="build-${VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          skopeo copy --all "oci:$RUNNER_TEMP/chunked" "docker://$IMAGE:$build_tag"
          digest=$(skopeo inspect --format '{{.Digest}}' "docker://$IMAGE:$build_tag")
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          umask 077
          keydir=$(mktemp -d "$RUNNER_TEMP/policy-signing.XXXXXXXX")
          trap 'rm -f -- "$keydir/original.pem" "$keydir/imported.key" "$keydir/imported.pub"; rmdir "$keydir"' EXIT
          printf '%s\n' "$SIGNING_SECRET" > "$keydir/original.pem"
          unset SIGNING_SECRET
          cosign import-key-pair --key "$keydir/original.pem" --output-key-prefix "$keydir/imported"
          cosign sign -y --new-bundle-format=false --key "$keydir/imported.key" "$IMAGE@$digest"
          cosign verify --key build_files/kpfe-test-signing.pub "$IMAGE@$digest" > "$RUNNER_TEMP/evidence/signature.json"
          jq -e --arg digest "$digest" --arg image "$IMAGE" 'any(.[];
            .critical.image["docker-manifest-digest"] == $digest and
            .critical.identity["docker-reference"] == $image)' "$RUNNER_TEMP/evidence/signature.json"
          test "$TEST_TAG" = test-kpfe-scoped-policy-20260928
          skopeo copy --all "docker://$IMAGE@$digest" "docker://$IMAGE:$TEST_TAG"
          test "$(skopeo inspect --format '{{.Digest}}' "docker://$IMAGE:$TEST_TAG")" = "$digest"
          jq -n --arg image "$IMAGE@$digest" --arg base "$BASE_IMAGE" \
            --arg revision "$GITHUB_SHA" --arg version "$VERSION" --arg tag "$build_tag" \
            --arg input_sha256 "$INPUT_SHA256" '{image:$image, base:$base, revision:$revision,
              version:$version, build_tag:$tag, input_sha256:$input_sha256,
              package_source:"fe40096cb558bce99978223974357486500e5931",
              kernel_rebuilt:false, kernel_replaced:true, initramfs_regenerated:true,
              kernel_archive_sha256:"0814bed69d64a188db231e3c927156ad40d5d02a1db98e7cd900cc5943c48148",
              activation:"disabled"}' > "$RUNNER_TEMP/evidence/build.json"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          printf 'Signed test image: `%s@%s`\n\nNo installation or charging activation performed.\n' "$IMAGE" "$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kpfe-scoped-policy-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: warn
          retention-days: 30
