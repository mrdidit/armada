---
name: Publish verified PR 737 test image

on:
  workflow_dispatch:
    inputs:
      upstream_run_id:
        description: Completed armada-os/armada PR workflow run ID
        required: true
        type: string
      upstream_run_attempt:
        description: Successful run attempt number
        required: true
        type: string
      expected_head_sha:
        description: Full PR 737 head commit SHA
        required: true
        type: string
      expected_merge_sha:
        description: Full synthetic merge SHA used by the upstream build
        required: true
        type: string
      expected_tree_sha:
        description: Expected Git tree SHA of the PR head
        required: true
        type: string
      expected_base_sha:
        description: Full base commit SHA used by the upstream build
        required: true
        type: string
      expected_merge_tree_sha:
        description: Expected Git tree SHA of the built synthetic merge
        required: true
        type: string
      artifact_id:
        description: Immutable armada-container-pr737 artifact ID
        required: true
        type: string
      artifact_sha256:
        description: SHA256 of the artifact ZIP from the GitHub API (64 hex digits)
        required: true
        type: string

permissions: {}

concurrency:
  group: pr737-artifact-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'mrdidit/armada' && github.ref == 'refs/heads/test-pr737-artifact-publisher-20261015'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      PR737_RUN_ID: ${{ inputs.upstream_run_id }}
      PR737_RUN_ATTEMPT: ${{ inputs.upstream_run_attempt }}
      PR737_HEAD_SHA: ${{ inputs.expected_head_sha }}
      PR737_MERGE_SHA: ${{ inputs.expected_merge_sha }}
      PR737_TREE_SHA: ${{ inputs.expected_tree_sha }}
      PR737_BASE_SHA: ${{ inputs.expected_base_sha }}
      PR737_MERGE_TREE_SHA: ${{ inputs.expected_merge_tree_sha }}
      PR737_ARTIFACT_ID: ${{ inputs.artifact_id }}
      PR737_ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
    steps:
      - name: Check out the publisher only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Free artifact storage
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      - name: Install inspection tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo jq openssl

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.3

      - name: Verify the existing fork signing identity
        env:
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_SECRET"
          printf '%s\n' "$SIGNING_SECRET" | openssl pkey -pubout -outform DER > "$RUNNER_TEMP/signing-public.der"
          openssl pkey -pubin -in .github/keys/pr737-publisher.pub -outform DER > "$RUNNER_TEMP/expected-public.der"
          cmp "$RUNNER_TEMP/signing-public.der" "$RUNNER_TEMP/expected-public.der"

      - name: Verify source and artifact, then inspect the OCI archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/prepare-pr737-artifact.py --output "$RUNNER_TEMP/pr737"

      - name: Publish and sign the verified image digest
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ''
        run: bash .github/scripts/publish-pr737-artifact.sh "$RUNNER_TEMP/pr737"

      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr737-publication-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr737/evidence/
          retention-days: 30
          if-no-files-found: warn
