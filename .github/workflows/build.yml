---
# Fork-only recovery: sign the already built image, then publish its test tag.
name: Finish AW99706 test image publication
on:
  workflow_dispatch:

concurrency:
  group: finish-aw99706-test-image
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'mrdidit/armada' && github.ref == 'refs/heads/test-aw99706-image-20260910'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/mrdidit/armada
      DIGEST: sha256:ba83613560a34f5ca04503d9775199a86481b97dd3be869ba53ecdb0217e3dc2
      SOURCE_REVISION: b076e630b692b3318675fd3c169f8b19078ee668
      TEST_TAG: test-aw99706-image-20260910
    steps:
      - name: Install registry tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo jq openssl

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.6.3'

      - name: Verify source, sign existing image, and publish test tag
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ''
        run: |
          set -euo pipefail
          test -n "${COSIGN_PRIVATE_KEY}"
          printf '%s' "${REGISTRY_TOKEN}" | skopeo login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          printf '%s' "${REGISTRY_TOKEN}" | cosign login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          ref="${IMAGE}@${DIGEST}"
          skopeo inspect "docker://${ref}" > "${RUNNER_TEMP}/armada-source.json"
          jq -e --arg digest "${DIGEST}" --arg revision "${SOURCE_REVISION}" \
            '.Digest == $digest and .Architecture == "arm64" and
             .Labels["org.opencontainers.image.revision"] == $revision' \
            "${RUNNER_TEMP}/armada-source.json"

          umask 077
          keydir=$(mktemp -d "${RUNNER_TEMP}/armada-signing.XXXXXX")
          trap 'rm -rf -- "${keydir}"' EXIT
          printf '%s\n' "${COSIGN_PRIVATE_KEY}" > "${keydir}/original.pem"
          cosign import-key-pair --key "${keydir}/original.pem" --output-key-prefix "${keydir}/imported"
          openssl pkey -in "${keydir}/original.pem" -pubout -outform DER -out "${keydir}/original-public.der"
          openssl pkey -pubin -in "${keydir}/imported.pub" -pubout -outform DER -out "${keydir}/imported-public.der"
          cmp "${keydir}/original-public.der" "${keydir}/imported-public.der"
          cosign sign -y --new-bundle-format=false --key "${keydir}/imported.key" "${ref}"
          cosign verify --key "${keydir}/imported.pub" "${ref}" > "${RUNNER_TEMP}/armada-signature.json"
          jq -e --arg digest "${DIGEST#sha256:}" --arg image "${IMAGE}" \
            'any(.[]; .critical.image["docker-manifest-digest"] == ("sha256:" + $digest)
               and .critical.identity["docker-reference"] == $image)' \
            "${RUNNER_TEMP}/armada-signature.json"
          skopeo copy --all "docker://${ref}" "docker://${IMAGE}:${TEST_TAG}"
          published=$(skopeo inspect --format '{{.Digest}}' "docker://${IMAGE}:${TEST_TAG}")
          test "${published}" = "${DIGEST}"
          printf 'Signed and verified `%s`, preserving the existing signing key.\n' "${ref}" >> "${GITHUB_STEP_SUMMARY}"
          printf '\nPublished test tag: `%s:%s`\n' "${IMAGE}" "${TEST_TAG}" >> "${GITHUB_STEP_SUMMARY}"
